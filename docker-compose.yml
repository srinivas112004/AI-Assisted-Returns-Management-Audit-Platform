version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: yotaa_returns_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: returns_management_db
      MYSQL_USER: yotaa_user
      MYSQL_PASSWORD: yotaa_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "yotaa_user", "-pyotaa_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yotaa_returns_backend
    restart: always
    environment:
      DATABASE_URL: mysql+pymysql://yotaa_user:yotaa_secret@db:3306/returns_management_db
      ENVIRONMENT: production
      DEBUG: "False"
      ADMIN_API_KEY: yotaa-secure-admin-token-2026
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:80", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yotaa_returns_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
